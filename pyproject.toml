[project]
name = "lattice-consult-mcp"
version = "0.1.0"
description = "Cross-provider LLM consultation MCP server. First impl of Trellis DSM-26 AngularTechnique substrate."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.10.0",
    "pydantic>=2.9.0",
]

[project.scripts]
lattice-consult-mcp = "lattice_consult_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_consult_mcp"]
